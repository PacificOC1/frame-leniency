name: Build mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the .geode file
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: frame-leniency/frame-leniency
          bindings-ref: f8aec5d1f3df76d840dfd2609f02cef30dc6efdf

      - name: Upload it
        uses: actions/upload-artifact@v4
        with:
          name: frame-leniency
          path: ${{ steps.build.outputs.build-output }}
