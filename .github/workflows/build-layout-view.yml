name: Build Layout View

on:
  workflow_dispatch:
  push:
    paths:
      - "layout-view/**"
      - ".github/workflows/build-layout-view.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the .geode file
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: layout-view
      - name: Upload it
        uses: actions/upload-artifact@v4
        with:
          name: layout-view
          path: ${{ steps.build.outputs.build-output }}
